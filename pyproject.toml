[project]
name = "event-tracker"
version = "0.1.0"
description = "Love Live & seiyuu event / klottery (lottery round) tracker — static site + Discord bot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
bot = [
    "discord.py>=2.3",
    "python-dotenv>=1.0",  # load config from .env for local runs
    "certifi>=2024.0",     # fallback CA bundle
    "truststore>=0.9",     # verify TLS via the OS trust store (handles corporate proxies)
]
llm = [
    # Provider-swappable LLM fallback. [google] pulls the Vertex AI (Gemini) backend;
    # add pydantic-ai-slim[anthropic] / [openai] to use those providers via LLM_MODEL.
    "pydantic-ai-slim[google]>=1.0",
]
web = [
    # Website Discord-login + subscription manager (bot/web.py). aiohttp also ships
    # with the `bot` extra (discord.py depends on it); listed here for web-only installs.
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "pre-commit>=3.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4"]  # pyflakes, isort, bugbear, pyupgrade, comprehensions
ignore = ["E501"]  # line length is handled by the formatter; long prompts/strings are fine

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]       # re-exports
"tests/*" = ["E402", "E731"]   # imports after env setup; lambda helpers are fine in tests

[tool.setuptools]
packages = ["schema", "build", "scrape", "bot"]

[tool.setuptools.package-data]
bot = ["web_static/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

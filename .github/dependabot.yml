version: 2
updates:
  # Keep the pinned GitHub Actions current (one grouped PR/week).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Python deps in uv.lock (pydantic-ai, discord.py, …).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

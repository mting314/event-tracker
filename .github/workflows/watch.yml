name: Watch official pages

# Polls the official lovelive-anime.jp pages in sources.yaml, diffs against
# events/*.yaml, and opens a PR with draft round snippets when something is new
# or a deadline changed. Human-in-the-loop: you review/merge into events/.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Run watcher
        run: uv run python -m scrape.watch --write | tee watch-report.txt
      - name: Open PR if there are drafts
        if: ${{ hashFiles('drafts/**') != '' }}
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: watcher/updates
          title: "Watcher: new/updated lottery rounds"
          body-path: watch-report.txt
          commit-message: "watcher: draft round updates from official pages"
          add-paths: drafts/**

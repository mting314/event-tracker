<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LL Lottery Tracker{% endblock %}</title>
  <link rel="icon" href="{{ base|default('') }}favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="{{ base|default('') }}static/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ base|default('') }}static/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ base|default('') }}static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ base|default('') }}index.html">🎫 LL Lottery Tracker</a>
    <nav>
      <a href="{{ base|default('') }}index.html" data-i18n="nav_events">Events</a>
      <a href="{{ base|default('') }}calendar.html" data-i18n="nav_calendar">Calendar</a>
      <a href="{{ base|default('') }}past.html" data-i18n="nav_past">Past</a>
      <a href="{{ base|default('') }}add.html" data-i18n="nav_add">+ Add</a>
      {% if subs_url %}<a href="{{ subs_url }}" data-i18n="nav_subs">My Subs</a>{% endif %}
    </nav>
    <label class="tz-toggle">
      <input type="checkbox" id="tz-local"> <span data-i18n="tz_local">Show local time</span>
    </label>
    <div class="lang-toggle" role="group" aria-label="Language / 言語">
      <button type="button" class="lang-btn" data-lang="en">English</button>
      <span class="lang-sep" aria-hidden="true">|</span>
      <button type="button" class="lang-btn" data-lang="ja">日本語</button>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p><span data-i18n="footer_a">Tracking</span> {{ event_count }} <span data-i18n="footer_b">events · all times JST unless toggled · curated from</span>
      <a href="https://www.eventernote.com/">eventernote</a> &amp; <span data-i18n="footer_c">official sources</span></p>
    <p><a href="{{ base|default('') }}terms.html" data-i18n="footer_terms">Terms</a> ·
      <a href="{{ base|default('') }}privacy.html" data-i18n="footer_privacy">Privacy</a></p>
  </footer>
  <script src="{{ base|default('') }}static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LL Lottery Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ base|default('') }}static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ base|default('') }}index.html">🎫 LL Lottery Tracker</a>
    <nav>
      <a href="{{ base|default('') }}catalog.html">Catalog</a>
      <a href="{{ base|default('') }}calendar.html">Calendar</a>
      <a href="{{ base|default('') }}past.html">Past</a>
      <a href="{{ base|default('') }}add.html">+ Add</a>
    </nav>
    <label class="tz-toggle">
      <input type="checkbox" id="tz-local"> Show local time
    </label>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Tracking {{ event_count }} events · all times JST unless toggled · curated from
      <a href="https://www.eventernote.com/">eventernote</a> &amp; official sources</p>
  </footer>
  <script src="{{ base|default('') }}static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
